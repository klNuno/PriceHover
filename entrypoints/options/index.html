<!DOCTYPE html>
<!-- No `lang` here: the UI ships in eight locales and App.svelte sets it from
     chrome.i18n.getUILanguage() on mount. An extension page cannot run an
     inline script under MV3's CSP, so this is as early as it gets. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A full tab, not the cramped embedded panel. WXT reads this into
         manifest.options_ui; setting it in wxt.config.ts alone gets overwritten. -->
    <meta name="manifest.open_in_tab" content="true" />
    <title>PriceHover</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
