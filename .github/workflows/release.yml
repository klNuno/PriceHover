name: Release

on:
  push:
    tags: ['v*.*.*']

# Publishing to the Chrome Web Store and to AMO is done by hand, so this
# workflow holds no store credentials and only needs to write the release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA: a moving tag would let an upstream
      # compromise run arbitrary code in a job that can write releases.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the changelog step walks back to the previous tag

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # public/_locales is generated from one table and committed. A key added
      # to the table without regenerating ships a manifest referencing a message
      # that does not exist, which blanks a label rather than failing loudly.
      - name: Check generated locales are up to date
        run: |
          bun run locales
          git diff --exit-code public/_locales

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build Chrome (MV3)
        run: bun run build

      - name: Build Firefox (MV3)
        run: bun run build:firefox

      - name: Zip Chrome
        run: bun run zip

      - name: Zip Firefox
        run: bun run zip:firefox

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          {
            echo "NOTES<<PRICEHOVER_EOF"
            echo "$LOG"
            echo "PRICEHOVER_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.changelog.outputs.NOTES }}
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
